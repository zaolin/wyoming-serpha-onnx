services:
  sherpa-onnx:
    build:
      context: .
      dockerfile: Dockerfile
    image: wyoming-sherpa-onnx:jetson-orin
    container_name: wyoming-sherpa-onnx
    restart: unless-stopped
    runtime: nvidia
    environment:
      # NVIDIA settings
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      # Model configuration - customize these
      - ASR_MODEL=sensevoice
      - TTS_MODEL=vits-piper-de_DE-thorsten-high
      - TTS_SPEAKER_ID=0
      # GPU acceleration
      - USE_GPU=true
      # Server URIs
      - ASR_URI=tcp://0.0.0.0:10300
      - TTS_URI=tcp://0.0.0.0:10400
    ports:
      # ASR (speech-to-text)
      - "10300:10300"
      # TTS (text-to-speech)
      - "10400:10400"
    volumes:
      # ASR model (e.g., SenseVoice)
      - ./models/asr:/app/models/asr:ro
      # TTS model (e.g., VITS Piper German)
      - ./models/tts:/app/models/tts:ro
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # For Wyoming protocol integration with Home Assistant
    # networks:
    #   - homeassistant

